name: Web workflows (cross-role chains + layout)

# S-125. Cross-role workflow chains (one browser per role, real UI login) + the layout sentinel.
# MANUAL ONLY — never on push / pull_request / schedule, never a required check, never a deploy step.
# Actions → Web workflows → Run workflow → pick a branch + `suite`.
#   suite=all                  every chain + the sentinel self-test
#   suite=wf-<chain>           one chain (its known-gap test included)
#   suite=layout               sentinel self-test only (static HTML; no Compose stack)
# Output: job-summary table (PASS / FAIL / KNOWN-GAP / SKIPPED per chain + layout findings),
# playwright-traces (playwright show-trace <zip>), pytest log, Compose logs.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "What to run"
        type: choice
        default: all
        options:
          - all
          - wf-listing-approval
          - wf-new-review
          - wf-featured-boost
          - wf-suspend
          - wf-review-moderation
          - wf-review-reply
          - wf-shop-edit
          - wf-whatsapp-draft
          - layout
      pytest_args:
        description: "Extra args appended to pytest (e.g. -x -k bell)"
        type: string
        default: ""

concurrency:
  group: web-workflows-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "${SUITE:-all}" in
            layout)
              path="tests/e2e/test_layout_sentinel_selftest.py"; stack=0; e2e="" ;;
            wf-*)
              file="tests/e2e/chains/test_$(echo "${SUITE}" | tr '-' '_').py"
              if [ ! -f "backend/${file}" ]; then echo "unknown suite ${SUITE}"; exit 1; fi
              path="${file}"; stack=1; e2e=1 ;;
            *)
              path="tests/e2e/chains tests/e2e/test_layout_sentinel_selftest.py"; stack=1; e2e=1 ;;
          esac
          echo "path=${path}"   >> "$GITHUB_OUTPUT"
          echo "stack=${stack}" >> "$GITHUB_OUTPUT"
          echo "e2e=${e2e}"     >> "$GITHUB_OUTPUT"

      - name: Make frontend writable for the container user
        if: steps.target.outputs.stack == '1'
        # docker-compose bind-mounts ./frontend:/app; the image runs as `node` (uid 1000) but the
        # runner checks out as uid 1001, so `next dev` cannot rewrite next-env.d.ts / .next.
        run: chmod -R a+rwX frontend

      - name: Start Compose stack
        if: steps.target.outputs.stack == '1'
        run: docker compose up --build -d

      - name: Wait for API and frontend
        if: steps.target.outputs.stack == '1'
        run: |
          echo "Waiting for backend /health..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "backend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become healthy"
            docker compose logs --no-color backend || true
            exit 1
          fi

          echo "Waiting for frontend :3000..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "frontend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "frontend did not become ready"
            docker compose logs --no-color frontend || true
            exit 1
          fi

      - name: Check the seed ran
        if: steps.target.outputs.stack == '1'
        # Compose runs `alembic upgrade head && seed.py && uvicorn`, so /health implies the seed finished.
        run: |
          if ! docker compose logs --no-color backend | grep -q "Seed complete"; then
            echo "seed did not run (no 'Seed complete' in backend logs)"
            docker compose logs --no-color backend || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps and Chromium
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run chains / layout sentinel
        working-directory: backend
        env:
          E2E: ${{ steps.target.outputs.e2e }}
          LAYOUT_SELFTEST_REQUIRE_BROWSER: "1"
          FRONTEND_URL: http://localhost:3000
          API_URL: http://localhost:8000/api/v1
          PYTHONPATH: .
          SECRET_KEY: ci-only-secret
          WF_SUMMARY_PATH: workflow-summary.md
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          set -o pipefail
          # PYTEST_ARGS is deliberately unquoted so extra flags split; no -n (the summary and the
          # one-bell-row-per-scenario rule both assume a single process).
          pytest ${{ steps.target.outputs.path }} $PYTEST_ARGS -v 2>&1 | tee pytest-workflows.log

      - name: Surface result in job summary
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
          TARGET: ${{ steps.target.outputs.path }}
        run: |
          {
            echo "### Web workflows — suite: \`${SUITE:-all}\`"
            echo "Target: \`${TARGET}\`"
            echo
            if [ -f backend/workflow-summary.md ]; then
              cat backend/workflow-summary.md
            else
              echo "_No chain summary produced (layout suite, or pytest stopped before collecting chains)._"
            fi
            echo
            echo "Download the **playwright-traces** artifact, then: \`playwright show-trace path/to/<test>-<role>.zip\`"
            echo
            echo "Manual dispatch only. Not a PR check. Does not deploy."
            if [ -f backend/pytest-workflows.log ]; then
              echo
              echo "<details><summary>pytest tail</summary>"
              echo
              echo '```'
              tail -n 80 backend/pytest-workflows.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Compose logs
        if: always() && steps.target.outputs.stack == '1'
        run: docker compose logs --no-color > compose-workflows.log
        continue-on-error: true

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-pytest-log
          path: backend/pytest-workflows.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Compose logs
        if: always() && steps.target.outputs.stack == '1'
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-workflows.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Compose
        if: always() && steps.target.outputs.stack == '1'
        run: docker compose down -v
