name: Mobile build APK

# Builds a sideloadable APK on GitHub's runners (Flutter + Android SDK) so you
# do not need the Android SDK installed locally. Runs on every push to main
# (QA artifact after merge) and on demand from Actions → "Mobile build APK" →
# Run workflow. Download the artifact and install on your phone. Uses the
# debug signing key (fine for personal QA; not for Play). Play/store uploads
# still use mobile-release-aab.yml + a real keystore.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Prod HTTPS API base URL (no trailing slash)"
        required: true
        default: "https://backend-production-2783.up.railway.app"

concurrency:
  group: mobile-build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Dispatch can override the API URL. Push to main uses the repo variable
      # when set, otherwise the Railway production default.
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.MOBILE_PROD_API_BASE_URL || 'https://backend-production-2783.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK (debug-signed for sideload)
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ vars.MOBILE_GOOGLE_CLIENT_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
