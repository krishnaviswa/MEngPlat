name: Mobile build APK

# Builds a sideloadable APK on GitHub's runners (Flutter + Android SDK) so you
# do not need the Android SDK installed locally. Runs on every push to main
# (QA artifact after merge) and on demand from Actions → "Mobile build APK" →
# Run workflow. Download the artifact and install on your phone. Signs with
# the committed mobile/android/sideload.keystore (stable SHA-1 for Android
# OAuth; not for Play). Play/store uploads still use mobile-release-aab.yml
# + a real keystore.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Prod HTTPS API base URL (no trailing slash)"
        required: true
        default: "https://backend-production-2783.up.railway.app"
      web_base_url:
        description: "Public website origin for collect QR (no trailing slash). Same URL you open in the browser."
        required: false

concurrency:
  group: mobile-build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.MOBILE_PROD_API_BASE_URL || 'https://backend-production-2783.up.railway.app' }}
      WEB_BASE_URL: ${{ github.event.inputs.web_base_url || vars.MOBILE_WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require MOBILE_WEB_BASE_URL
        run: |
          if [ -z "$WEB_BASE_URL" ]; then
            echo "Set GitHub variable MOBILE_WEB_BASE_URL (or the web_base_url workflow input) to the public site origin, with no trailing slash."
            echo "Use the same origin you open in a browser for the collect page — not the Railway frontend-production hostname and not the API host."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK (sideload-signed)
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ vars.MOBILE_GOOGLE_CLIENT_ID }} \
            --dart-define=WEB_BASE_URL=${{ env.WEB_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
