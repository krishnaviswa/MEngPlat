name: Frontend tests

# Runs the Jest/RTL suite. No backend/DB dependency -- component-level tests only.
# See README.md #14 "No CI/CD for app tests".

# TEMP (POC): PR/push triggers disabled so product work isn't blocked by CI.
# Re-enable the push + pull_request blocks below when ready to enforce checks again.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "frontend/**"
  # pull_request:
  #   paths:
  #     - "frontend/**"

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Jest
        working-directory: frontend
        run: npm test -- --ci
