name: Web e2e (Playwright)

# Second view: headless Chromium against Docker Compose (mock AI/email/payments, local storage).
# Manual only — never on push/PR, never after a deploy, never mixed into pytest/Jest jobs.
# Actions → Web e2e (Playwright) → Run workflow → download playwright-traces.
# Inspect locally: playwright show-trace <test-name>.zip

on:
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up --build -d

      - name: Wait for API and frontend
        run: |
          echo "Waiting for backend /health..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "backend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become healthy"
            docker compose logs --no-color backend || true
            exit 1
          fi

          echo "Waiting for frontend :3000..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "frontend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "frontend did not become ready"
            docker compose logs --no-color frontend || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps and Chromium
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Playwright e2e
        working-directory: backend
        env:
          E2E: "1"
          E2E_FULL: "1"  # S-124: enable the session-teardown catalogue-coverage guard
          FRONTEND_URL: http://localhost:3000
          API_URL: http://localhost:8000/api/v1
          PYTHONPATH: .
          SECRET_KEY: ci-only-secret
        run: |
          set -o pipefail
          pytest tests/e2e -v 2>&1 | tee pytest-e2e.log

      - name: Surface result in job summary
        if: always()
        run: |
          {
            echo "### Web e2e (Playwright)"
            echo "Download the **playwright-traces** artifact from this run, then:"
            echo '```'
            echo "playwright show-trace path/to/<test-name>.zip"
            echo '```'
            echo
            echo "Dispatch-only. Does not deploy. Does not run on push or pull_request."
            if [ -f backend/pytest-e2e.log ]; then
              echo
              echo "<details><summary>pytest tail</summary>"
              echo
              echo '```'
              tail -n 80 backend/pytest-e2e.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-e2e.log
        continue-on-error: true

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pytest-log
          path: backend/pytest-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Compose
        if: always()
        run: docker compose down -v
