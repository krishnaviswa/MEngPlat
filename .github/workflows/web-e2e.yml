name: Web e2e (Playwright)

# Second view: headless Chromium against Docker Compose (mock AI/email/payments, local storage).
# Manual only — never on push/PR, never after a deploy, never mixed into pytest/Jest jobs.
# Actions → Web e2e (Playwright) → Run workflow → pick a branch + `suite` → download playwright-traces.
#   suite=all       full tests/e2e pack (S-010 flows + S-124 journeys + smoke + rbac + token)
#   suite=journeys  S-124 predefined-value journeys + selector canary only (coverage guard armed)
#   suite=journey-* one role file (no coverage guard)
# The GitHub runner provides Docker — no local Docker needed. Inspect: playwright show-trace <zip>

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which e2e subset to run"
        type: choice
        default: all
        options:
          - all            # tests/e2e  (S-010 flows + S-124 journeys + smoke + rbac + token)
          - journeys       # tests/e2e/journeys + test_selectors_smoke.py  (S-124 only)
          - journey-anonymous
          - journey-customer
          - journey-merchant
          - journey-admin
          - smoke          # tests/e2e/test_smoke_compose.py
      pytest_args:
        description: "Extra args appended to pytest (e.g. -x -k report)"
        type: string
        default: ""

concurrency:
  group: web-e2e-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up --build -d

      - name: Wait for API and frontend
        run: |
          echo "Waiting for backend /health..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "backend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become healthy"
            docker compose logs --no-color backend || true
            exit 1
          fi

          echo "Waiting for frontend :3000..."
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "frontend ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "frontend did not become ready"
            docker compose logs --no-color frontend || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps and Chromium
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Resolve pytest target
        id: target
        run: |
          case "${{ inputs.suite || 'all' }}" in
            all)               path="tests/e2e";                          full=1 ;;
            journeys)          path="tests/e2e/journeys tests/e2e/test_selectors_smoke.py"; full=1 ;;
            journey-anonymous) path="tests/e2e/journeys/test_journey_anonymous.py"; full=0 ;;
            journey-customer)  path="tests/e2e/journeys/test_journey_customer.py";  full=0 ;;
            journey-merchant)  path="tests/e2e/journeys/test_journey_merchant.py";  full=0 ;;
            journey-admin)     path="tests/e2e/journeys/test_journey_admin.py";     full=0 ;;
            smoke)             path="tests/e2e/test_smoke_compose.py";              full=0 ;;
            *)                 path="tests/e2e";                          full=1 ;;
          esac
          echo "path=$path"   >> "$GITHUB_OUTPUT"
          echo "full=$full"   >> "$GITHUB_OUTPUT"

      - name: Run Playwright e2e
        working-directory: backend
        env:
          E2E: "1"
          # S-124 catalogue-coverage guard — only meaningful when every journey runs
          E2E_FULL: ${{ steps.target.outputs.full }}
          FRONTEND_URL: http://localhost:3000
          API_URL: http://localhost:8000/api/v1
          PYTHONPATH: .
          SECRET_KEY: ci-only-secret
        run: |
          set -o pipefail
          pytest ${{ steps.target.outputs.path }} ${{ inputs.pytest_args }} -v 2>&1 | tee pytest-e2e.log

      - name: Surface result in job summary
        if: always()
        run: |
          {
            echo "### Web e2e (Playwright) — suite: \`${{ inputs.suite || 'all' }}\`"
            echo "Target: \`${{ steps.target.outputs.path }}\` (coverage guard: ${{ steps.target.outputs.full }})"
            echo
            echo "Download the **playwright-traces** artifact from this run, then:"
            echo '```'
            echo "playwright show-trace path/to/<test-name>.zip"
            echo '```'
            echo
            echo "Dispatch-only. Does not deploy. Does not run on push or pull_request."
            if [ -f backend/pytest-e2e.log ]; then
              echo
              echo "<details><summary>pytest tail</summary>"
              echo
              echo '```'
              tail -n 80 backend/pytest-e2e.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose-e2e.log
        continue-on-error: true

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pytest-log
          path: backend/pytest-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Compose
        if: always()
        run: docker compose down -v
