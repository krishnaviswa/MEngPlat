name: Mobile emulator check

# Boots a real Android emulator on GitHub's own Linux runners (KVM-accelerated,
# via reactivecircus/android-emulator-runner) against a throwaway Postgres/Redis
# + backend stood up in the same job -- never against the hosted Railway DB.
# Runs the login -> business-list flow from mobile/integration_test/app_test.dart
# and uploads a screenshot as a build artifact. Day-to-day local iteration uses
# Flutter Web instead of a Windows emulator; release AAB/Play is still deferred
# (see ANDROID_APP_STRATEGY.md phase 5).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "backend/**"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/**"

# Rapid-fire commits to the same PR/branch would otherwise queue up one full
# emulator run per push. This cancels a still-running check when a newer
# commit lands on the same ref, so only the latest (the one that actually
# matters before merge) finishes -- not every intermediate commit.
concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    # Fast, no-emulator gate: catches lint/type/unit-test breaks in seconds
    # instead of waiting on the slow KVM emulator job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter test
        working-directory: mobile
        run: flutter test

  emulator-test:
    needs: analyze-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merchanthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/merchanthub
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret
      SEED_MODE: force

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate + seed demo data
        working-directory: backend
        run: |
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python scripts/seed.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend healthy after $((i*2))s"
              exit 0
            fi
            if ! kill -0 "$(cat uvicorn.pid)" 2>/dev/null; then
              echo "uvicorn process died before becoming healthy"
              break
            fi
            sleep 2
          done
          echo "=== backend.log ===" && cat backend.log
          {
            echo "### Backend failed to start"
            echo '```'
            cat backend.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: warn

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run login + business-list flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: mobile
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:8000

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: mobile/build/screenshots/*.png
          if-no-files-found: warn
