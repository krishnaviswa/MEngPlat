[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    e2e: browser journeys against Compose (opt-in: E2E=1)
    journey_anonymous: S-124 human-driven anonymous/public journey
    journey_customer: S-124 human-driven customer journey
    journey_merchant: S-124 human-driven merchant journey
    journey_admin: S-124 human-driven admin journey
    catalog: S-124 predefined-value catalogue coverage / selector canary
    slow: long-running cross-role journey
    layout_selftest: layout sentinel self-test on static HTML (no Compose stack, no E2E=1)
    workflow_chain: cross-role workflow chain (S-125)
