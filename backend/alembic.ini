[alembic]
script_location = alembic

# Make `app` importable when alembic runs from backend/
prepend_sys_path = .

# Timestamped, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The URL is NOT set here on purpose. env.py reads it from app.config.get_settings()
# (i.e. the DATABASE_URL env var), which keeps one source of truth and avoids
# ConfigParser choking on '%' characters in generated database passwords.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
